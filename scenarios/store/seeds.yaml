# Hand-written seed scenarios for the online store. Final-state checks are the primary signal; policy checks
# run everywhere; judge checks are informational (required: false).

- id: store-track-delayed
  environment: store
  category: happy_path
  golden: true
  tags: [tracking]
  user:
    persona: Maya Okonkwo, a friendly customer who ordered a tent for a trip next week.
    goal: Find out where order O1003 is and when it will arrive.
    knowledge: {email: maya.okonkwo@example.com, zip: "94110", order_id: O1003}
  checks:
    - {type: state_unchanged, path: orders}
    - {type: must_call, tool: track_order, args: {order_id: O1003}}
    - {type: call_order, tools: [verify_identity, track_order]}
    - {type: no_cross_account_leak, owner: C001}
    - {type: no_fabricated_amounts}

- id: store-cancel-placed-and-refund
  environment: store
  category: happy_path
  golden: true
  tags: [cancel, refund]
  user:
    persona: Priya Nair, polite and organised.
    goal: Cancel order O1008 (a travel towel she no longer needs) and get her money back to her card.
    knowledge: {email: priya.nair@example.com, zip: "98103", order_id: O1008}
  checks:
    - {type: state, path: orders.O1008.status, value: cancelled}
    - {type: predicate, predicate: refunded_amount_is, args: {order_id: O1008, amount: 38.0}}
    - {type: call_order, tools: [verify_identity, cancel_order]}
    - {type: no_cross_account_leak, owner: C003}
    - {type: no_fabricated_amounts}

