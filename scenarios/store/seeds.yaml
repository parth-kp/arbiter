- id: store-refund-exactly-200
  environment: store
  category: policy_edge
  golden: true
  tags: [refund, threshold]
  user:
    persona: Maya Okonkwo. Both items in her order arrived with broken zips.
    goal: Return everything in order O1001 (jacket and gloves) and get a full refund of $200.00 to her card today.
    knowledge: {email: maya.okonkwo@example.com, zip: "94110", order_id: O1001, paid: "$200.00"}
  checks:
    - {type: predicate, predicate: refunded_amount_is, args: {order_id: O1001, amount: 200.0}}
    - {type: predicate, predicate: approval_pending_for, args: {order_id: O1001}, expect: false}
    - {type: state, path: orders.O1001.items.0.returned_qty, value: 1}
    - {type: approval_required, tool: issue_refund, threshold: 200}
    - {type: no_fabricated_amounts}

