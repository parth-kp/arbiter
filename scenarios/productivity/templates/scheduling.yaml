scenario:
  id: prod-gen-schedule-{{sid}}
  environment: productivity
  category: "{{cat}}"
  tags: [calendar, timezones, generated]
  user:
    persona: Alex Morgan.
    goal: "Book a {{dur}}-minute call with {{name}} on {{day}} at any time that works for both of them. If there is no such time, accept the assistant's explanation."
    hidden: Accept any time the assistant proposes. You don't know the other person's time zone.
  checks:
    - type: predicate
      predicate: new_event_matches
      args: {attendees: ["{{email}}"], window_start_utc: "{{date}}T11:00:00Z", window_end_utc: "{{next}}T04:00:00Z", min_minutes: {{dur}}, max_minutes: {{dur}}, count: {{count}}}
    - {type: predicate, predicate: no_overlapping_events}
